name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # no code signing in CI
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Node 22 ships npm 10, which runs install scripts: node-pty's picks its prebuilt addon. Since Electron 42
      # the electron package no longer downloads its binary on install (it does so on the first `npx electron`),
      # and packaging does not need it: electron-builder fetches the Electron zip for the target itself.
      - name: Install dependencies
        run: |
          npm --version
          npm ci

      - name: Check native dependencies
        shell: bash
        run: |
          node -e '
            require("node-pty");
            console.log("node-pty: loads");
            console.log("electron:", require("electron/package.json").version);
          '

      - name: Unit tests
        run: npm test

      # the installer and dist/win-unpacked in one build, as release.yml builds them: only an NSIS build writes
      # resources/app-update.yml, without which the app cannot update itself
      - name: Build the installer
        run: npx electron-builder --win nsis --publish never

      - name: Smoke test of the packaged app
        run: node test/smoke/packaged.js

      # what electron-updater relies on: latest.yml names this installer with its real sha512, the blockmap
      # covers it, the installer needs no elevation, app-update.yml points at this repository
      - name: Release files
        run: node test/smoke/release-files.js

      # sizes in the job summary, so a change that bloats the package shows up in review
      - name: Package size
        shell: pwsh
        run: |
          $mb = { param($n) '{0:N1} MB' -f ($n / 1MB) }
          $sum = { param($p) (Get-ChildItem $p -Recurse -File | Measure-Object Length -Sum).Sum }
          $setup = Get-Item dist/Kolonka-Setup-*.exe
          $rows = @(
            @('installer', $setup.Length),
            @('win-unpacked', (& $sum dist/win-unpacked)),
            @('locales', (& $sum dist/win-unpacked/locales)),
            @('resources/app.asar', (Get-Item dist/win-unpacked/resources/app.asar).Length),
            @('resources/app.asar.unpacked', (& $sum dist/win-unpacked/resources/app.asar.unpacked))
          )
          $md = @('| | size | bytes |', '|---|---|---|') + ($rows | ForEach-Object { "| $($_[0]) | $(& $mb $_[1]) | $($_[1]) |" })
          $md -join "`n" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist/win-unpacked/resources/app.asar.unpacked -Recurse -File | ForEach-Object { '{0,12} {1}' -f $_.Length, $_.FullName.Substring((Resolve-Path dist/win-unpacked).Path.Length + 1) }

      # the round trip covers the uninstaller's hook cleanup
      - name: Install / uninstall round trip
        run: node test/smoke/installer.js

      # The same app with the patch version + 1, served from a local feed: the installed base version finds it,
      # downloads it and installs it, once on quit and once with "Restart to update".
      - name: Build the next version
        shell: bash
        run: |
          next=$(node -p "const v = require('./package.json').version.split('.').map(Number); v[2]++; v.join('.')")
          npx electron-builder --win nsis --publish never -c.extraMetadata.version=$next -c.directories.output=dist-next
          node test/smoke/release-files.js dist-next "$next"

      - name: Update through electron-updater
        run: node test/smoke/updater.js dist dist-next
