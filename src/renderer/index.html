<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; font-src 'self' data:">
  <title>Kolonka</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head drag">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="3" width="6" height="18" rx="2" class="bm-col"/>
            <rect x="11" y="3" width="10.5" height="18" rx="2.5" class="bm-card"/>
            <path d="M13.6 9.2l2.4 2.3-2.4 2.3" class="bm-chev"/>
            <path d="M17.2 14.2h2.2" class="bm-chev"/>
          </svg>
          <span class="brand-name">Kolonka</span>
        </div>
      </div>
      <div id="tree" role="tree"></div>
      <div class="side-foot">
        <button class="foot-btn" id="btn-new-session" data-i18n-title="ui.newSessionTip" title="New session (Ctrl+Shift+T)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="ui.session">Session</span>
        </button>
        <button class="foot-btn" id="btn-new-ws" data-i18n-title="ui.newWsTip" title="New workspace (Ctrl+Shift+N)">
          <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 11v5M9.5 13.5h5"/></svg><span data-i18n="ui.workspace">Workspace</span>
        </button>
        <div class="foot-spacer"></div>
        <button class="icon-btn" id="btn-palette" data-i18n-title="ui.paletteTip" title="Commands (Ctrl+Shift+P)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" data-i18n-title="ui.settingsTip" title="Settings and API">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </div>
    </aside>
    <div id="resizer" data-i18n-title="ui.resizerTip"></div>
    <main id="main">
      <header id="topbar" class="drag">
        <div id="crumbs"></div>
      </header>
      <section id="card">
        <div id="terms"></div>
        <div id="empty" hidden>
          <div class="empty-inner">
            <div class="empty-title" data-i18n="ui.emptyTitle">No open sessions</div>
            <div class="empty-sub" data-i18n="ui.emptySub"></div>
            <div class="empty-actions">
              <button class="btn primary" data-act="new-session" data-i18n="ui.newSession">New session</button>
              <button class="btn" data-act="new-ws" data-i18n="ui.newWorkspace">New workspace</button>
            </div>
            <div class="empty-keys">
              <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>T</kbd> <i data-i18n="ui.keySession">session</i></span>
              <span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd> <i data-i18n="ui.keyCommands">commands</i></span>
            </div>
          </div>
        </div>
        <div id="dictate" hidden></div>
        <div id="findbar" hidden>
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="find-input" data-i18n-ph="ui.findPh" spellcheck="false">
          <span id="find-count"></span>
          <button class="icon-btn sm" id="find-prev" data-i18n-title="ui.findPrev"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <button class="icon-btn sm" id="find-next" data-i18n-title="ui.findNext"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          <button class="icon-btn sm" id="find-close" data-i18n-title="ui.findClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </section>
    </main>
  </div>

  <div id="palette" hidden>
    <div class="pal-box" role="dialog">
      <input id="pal-input" spellcheck="false" autocomplete="off" data-i18n-ph="pal.placeholder">
      <div id="pal-list" role="listbox"></div>
      <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> <i data-i18n="pal.kSelect">select</i></span><span><kbd>Enter</kbd> <i data-i18n="pal.kOpen">open</i></span><span><kbd>Esc</kbd> <i data-i18n="pal.kClose">close</i></span></div>
    </div>
  </div>
  <div id="menu" hidden></div>
  <div id="toasts"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="icons.js"></script>
  <script src="uilogic.js"></script>
  <script src="dictation.js"></script>
  <script src="app.js"></script>
</body>
</html>
